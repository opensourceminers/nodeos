# Builds release binaries when a v* tag is pushed. The self-updater in
# nodeosd downloads exactly these assets and verifies them against SHA256SUMS.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/nodeosd-linux-amd64 ./cmd/nodeosd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/nodeosd-linux-arm64 ./cmd/nodeosd
          cd dist && sha256sum nodeosd-linux-amd64 nodeosd-linux-arm64 > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nodeosd-linux-amd64
            dist/nodeosd-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
